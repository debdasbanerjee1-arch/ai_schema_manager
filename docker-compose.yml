version: "3.9"

services:

  # ── PostgreSQL Database ───────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: schema_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       schemadb
      POSTGRES_USER:     admin
      POSTGRES_PASSWORD: admin123
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d schemadb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Application ───────────────────────────────────────
  api:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: schema_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DB_HOST:        db
      DB_PORT:        "5432"
      DB_NAME:        schemadb
      DB_USER:        admin
      DB_PASS:        admin123
    ports:
      - "8000:8000"

  # ── pgAdmin (optional visual DB manager) ─────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: schema_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL:    admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  pg_data:
